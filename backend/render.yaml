services:
  - type: web
    name: cozycrypto-trader
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BITGET_API_KEY
        sync: false
      - key: BITGET_SECRET_KEY
        sync: false
      - key: BITGET_PASSPHRASE
        sync: false
      - key: GOVERNOR_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: TRADER_REPO
        value: fassdavid722-cpu/cozycrypto-trader
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: MAX_TRADE_PERCENT
        value: "10"
      - key: STOP_LOSS_PERCENT
        value: "2"
      - key: TAKE_PROFIT_PERCENT
        value: "4"
      - key: MAX_OPEN_TRADES
        value: "3"
